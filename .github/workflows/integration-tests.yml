name: Integration Tests (third-party systems)

# Manual trigger for a controlled demo: proves the pipeline makes real calls
# to SuccessFactors and AI Core through resolved BTP destination bindings.
on:
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install SAP CDS toolkit (cds CLI)
        run: npm install --global @sap/cds-dk

      - name: Install Cloud Foundry CLI v8
        run: |
          set -euo pipefail
          curl -sL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
          cf version

      - name: Authenticate and target Cloud Foundry
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USER: ${{ secrets.CF_USER }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
        run: |
          set -euo pipefail
          cf api "$CF_API"
          cf auth "$CF_USER" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: Run integration tests against live third-party systems
        run: |
          set -euo pipefail
          npm run integration-test

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Integration tests passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The pipeline reached the live third-party systems through resolved BTP destination bindings:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **SuccessFactors** (\`PLTUserManagement\`) — read \`SFSF_User\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **SAP AI Core** (\`aicore\`) — \`Project/summarize\` completion" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Integration tests failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the **Run integration tests** step log. A missing/failed binding shows as \`Could not find service binding of type 'destination'\` or \`Failed to load destination\`." >> "$GITHUB_STEP_SUMMARY"
          fi
